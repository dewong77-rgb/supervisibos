<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuesioner Satuan Pendidikan, BOSP Kinerja Terbaik 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A3E6F; --navy-deep: #122A4D; --gold: #E8A020;
    --paper: #FAF7F1; --paper-card: #FFFFFF; --ink: #22262E; --ink-soft: #5B6270;
    --line: #E4DFD3; --green: #2E7D5B; --red: #B84C3E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Public Sans', sans-serif; height: 100vh; overflow: hidden; }
  h1, h2, .brand { font-family: 'Fraunces', serif; }
  .layout { display: flex; height: 100vh; }

  aside { width: 320px; flex-shrink: 0; background: var(--navy); color: white; display: flex; flex-direction: column; height: 100vh; }
  aside .brand-block { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.14); }
  aside .brand { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  aside .brand-sub { font-size: 12px; color: rgba(255,255,255,0.65); }
  aside .brand-asal { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gold); background: rgba(232,160,32,0.15); display: inline-block; padding: 3px 9px; border-radius: 20px; margin-top: 6px; }
  .nav-scroll { flex: 1; overflow-y: auto; padding: 10px 0 18px; }
  .nav-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); padding: 12px 18px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; cursor: pointer; font-size: 13.5px; color: rgba(255,255,255,0.85); border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: rgba(255,255,255,0.12); border-left-color: var(--gold); color: white; font-weight: 600; }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.25); }
  .nav-dot.filled { background: var(--gold); }
  .nav-item .kode { font-variant-numeric: tabular-nums; opacity: 0.7; flex-shrink: 0; width: 22px; }
  .nav-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .badge-2025 { font-size: 9px; font-weight: 700; background: var(--gold); color: var(--navy-deep); padding: 2px 6px; border-radius: 8px; flex-shrink: 0; }

  main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { padding: 16px 32px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; background: var(--paper-card); }
  .topbar .sekolah-label { font-size: 13px; color: var(--ink-soft); }
  .topbar .sekolah-label strong { color: var(--ink); }
  .status-badge { font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
  .status-badge.saved { background: #E9F3EC; color: var(--green); }
  .status-badge.saving { background: #FBEBD8; color: #A5651A; }
  .status-badge.error { background: #FBE9E6; color: var(--red); }
  .status-badge.idle { background: #EFEAE0; color: var(--ink-soft); }

  .content { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 760px; }
  .item-kode { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
  .item-title { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 0 0 8px; color: var(--navy-deep); }
  .item-pendalaman { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; background: #F3EEE3; border-left: 3px solid var(--gold); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 24px; }
  .kondisional-note { font-size: 12.5px; color: #A5651A; background: #FBEBD8; padding: 8px 14px; border-radius: 8px; margin-bottom: 18px; display: inline-block; }

  .block { margin-bottom: 26px; }
  .block-label { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
  .opt-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; cursor: pointer; }
  .opt-row input[type=checkbox], .opt-row input[type=radio] { margin-top: 3px; accent-color: var(--navy); width: 16px; height: 16px; flex-shrink: 0; }
  .opt-row label { font-size: 14px; line-height: 1.4; cursor: pointer; }
  .lainnya-input { width: 100%; margin-top: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: 'Public Sans', sans-serif; font-size: 13.5px; }
  .teksbebas-input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.6; resize: vertical; }
  .teksbebas-input:focus { outline: none; border-color: var(--navy); }
  .lainnya-input:focus { outline: none; border-color: var(--navy); }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--navy-deep); color: white; padding: 13px 24px; border-radius: 30px;
    font-family: 'Public Sans', sans-serif; font-size: 13.5px; font-weight: 600;
    box-shadow: 0 10px 28px rgba(18,42,77,0.32); opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease; z-index: 1000;
    display: flex; align-items: center; gap: 9px; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.toast-selesai { background: var(--green); padding: 15px 26px; font-size: 14px; }
  .toast.toast-error { background: var(--red); }

  .angka-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .angka-row label { font-size: 14px; }
  .angka-input { width: 90px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-family: 'Public Sans', sans-serif; font-size: 14px; }
  .angka-input:focus { outline: none; border-color: var(--navy); }

  .identitas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
  .identitas-field { grid-column: span 1; }
  .identitas-field.full { grid-column: span 2; }
  .identitas-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .identitas-field input, .identitas-field select { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-family: 'Public Sans', sans-serif; font-size: 14px; }
  .identitas-field input:focus, .identitas-field select:focus { outline: none; border-color: var(--navy); }
  .identitas-field input[readonly] { background: #F3EEE3; color: var(--ink-soft); }

  .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; padding-bottom: 40px; }
  .nav-buttons button { background: var(--paper-card); border: 1px solid var(--line); color: var(--navy); font-family: 'Public Sans', sans-serif; font-weight: 600; font-size: 13.5px; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  .nav-buttons button:hover { border-color: var(--navy); }
  .nav-buttons button:disabled { opacity: 0.4; cursor: default; }

  .loading-state { text-align: center; padding: 80px 20px; color: var(--ink-soft); }

  .ringkasan-wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 60px; }
  .ringkasan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .ringkasan-title { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; color: var(--navy-deep); }
  .ringkasan-sub-title { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .ringkasan-edit-btn { background: var(--navy); color: white; text-decoration: none; font-weight: 600; font-size: 13px; padding: 9px 18px; border-radius: 8px; flex-shrink: 0; }
  .ringkasan-edit-btn:hover { background: var(--navy-deep); }
  .ringkasan-block { margin-bottom: 28px; }
  .ringkasan-section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); font-weight: 700; margin-bottom: 12px; }
  .ringkasan-item { margin-bottom: 16px; }
  .ringkasan-q { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .ringkasan-sub { margin: 6px 0 6px 10px; }
  .ringkasan-kelompok { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 2px; }
  .ringkasan-a { font-size: 13.5px; color: var(--ink); line-height: 1.6; }
  .ringkasan-a.kosong { color: var(--ink-soft); font-style: italic; }
</style>
</head>
<body>

<div id="app"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwH15DkjOR3dI6etG7aAWMP_r9bPCLSI5o94jmJKlf1BB5b1uYqUOspNNI_gfpEAA7fgw/exec';

  // Coba ulang otomatis kalau gagal -- Apps Script bisa sesaat sibuk kalau
  // banyak orang mengakses bersamaan, terutama di lokasi seperti BPMP saat
  // banyak Fasda/Fasnas isi bareng. Percobaan kedua dan ketiga dikasih
  // jeda supaya tidak numpuk lagi.
  async function fetchDenganRetry(url, options, percobaan) {
    percobaan = percobaan || 0;
    try {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (err) {
      if (percobaan < 4) {
        await new Promise(r => setTimeout(r, 1000 * (percobaan + 1)));
        return fetchDenganRetry(url, options, percobaan + 1);
      }
      throw err;
    }
  }

  function normalisasiJawaban(obj) {
    const hasil = {};
    Object.keys(obj || {}).forEach(k => { hasil[k] = String(obj[k]); });
    return hasil;
  }

  const params = new URLSearchParams(window.location.search);
  const sekolah = params.get('sekolah');
  const npsn = params.get('npsn') || '';
  const kabkota = params.get('kabkota') || '';
  const provinsi = params.get('provinsi') || '';
  const asal = params.get('asal') || 'Tidak diketahui';
  const modeLihat = params.get('mode') === 'lihat';

  const IDENTITAS_FIELDS = [
    { kode: 'identitas:tanggal', label: 'Tanggal Pengisian', tipe: 'date' },
    { kode: 'identitas:nama_responden', label: 'Nama Responden', tipe: 'text' },
    { kode: 'identitas:jabatan_responden', label: 'Jabatan Responden', tipe: 'select', opsi: ['Kepala Sekolah', 'Bendahara', 'Tim BOSP'] }
  ];

  let state = { pertanyaan: [], jawaban: {}, activeNo: 'identitas', saveTimers: {} };

  async function init() {
    if (!sekolah || !npsn) {
      document.getElementById('app').innerHTML = '<div class="loading-state">Link tidak lengkap, perlu parameter sekolah dan npsn di URL.</div>';
      return;
    }
    document.getElementById('app').innerHTML = '<div class="loading-state">Memuat instrumen...</div>';
    try {
      const data = await fetchDenganRetry(`${API_URL}?action=satdik-data&npsn=${encodeURIComponent(npsn)}`);
      if (data.error) {
        document.getElementById('app').innerHTML = `<div class="loading-state">${data.error}</div>`;
        return;
      }
      state.pertanyaan = data.pertanyaan;
      state.jawaban = normalisasiJawaban(data.jawaban);
      if (modeLihat) { renderRingkasan(); } else { renderApp(); }
    } catch (err) {
      document.getElementById('app').innerHTML = '<div class="loading-state">Gagal memuat data. Coba muat ulang halaman.</div>';
      console.error(err);
    }
  }

  function renderRingkasan() {
    // Lepas kunci tinggi/overflow di body -- sama alasan dengan
    // wawancara.html/fgd.html, supaya halaman ringkasan panjang bisa
    // di-scroll, bukan kepotong di batas layar.
    document.body.style.height = 'auto';
    document.body.style.overflow = 'auto';

    const groups = {};
    state.pertanyaan.forEach(p => {
      if (!groups[p.section]) groups[p.section] = [];
      groups[p.section].push(p);
    });

    let blokHtml = '';
    Object.keys(groups).forEach(section => {
      blokHtml += `<div class="ringkasan-block"><div class="ringkasan-section-title">${section}</div>`;
      groups[section].forEach(p => {
        blokHtml += `<div class="ringkasan-item"><div class="ringkasan-q">No ${p.no} &middot; ${p.pertanyaan}</div>`;
        p.blocks.forEach(b => {
          const kode = kodeBlok(p.no, b.kelompok);
          const isi = (state.jawaban[kode] || '').trim();
          blokHtml += `
            <div class="ringkasan-sub">
              ${b.kelompok ? `<div class="ringkasan-kelompok">${b.kelompok}</div>` : ''}
              <div class="ringkasan-a ${!isi ? 'kosong' : ''}">${isi ? isi.replace(/\n/g, ', ') : '(belum diisi)'}</div>
            </div>
          `;
        });
        blokHtml += '</div>';
      });
      blokHtml += '</div>';
    });

    const idHtml = `<div class="ringkasan-block"><div class="ringkasan-section-title">Identitas</div>
      <div class="ringkasan-item"><div class="ringkasan-q">Nama Sekolah</div><div class="ringkasan-a">${sekolah}</div></div>
      <div class="ringkasan-item"><div class="ringkasan-q">NPSN</div><div class="ringkasan-a">${npsn}</div></div>
      <div class="ringkasan-item"><div class="ringkasan-q">Kabupaten/Kota</div><div class="ringkasan-a">${kabkota}</div></div>
      <div class="ringkasan-item"><div class="ringkasan-q">Provinsi</div><div class="ringkasan-a">${provinsi}</div></div>
      ${IDENTITAS_FIELDS.map(f => {
        const isi = (state.jawaban[f.kode] || '').trim();
        return `<div class="ringkasan-item"><div class="ringkasan-q">${f.label}</div><div class="ringkasan-a ${!isi ? 'kosong' : ''}">${isi || '(belum diisi)'}</div></div>`;
      }).join('')}
    </div>`;

    document.getElementById('app').innerHTML = `
      <div class="ringkasan-wrap">
        <div class="ringkasan-header">
          <div>
            <div class="ringkasan-title">Ringkasan Kuesioner Satuan Pendidikan</div>
            <div class="ringkasan-sub-title">${sekolah} &middot; ${kabkota}</div>
          </div>
          <a class="ringkasan-edit-btn" href="?sekolah=${encodeURIComponent(sekolah)}&npsn=${encodeURIComponent(npsn)}&kabkota=${encodeURIComponent(kabkota)}&provinsi=${encodeURIComponent(provinsi)}&asal=${encodeURIComponent(asal)}">Edit Isian</a>
        </div>
        ${idHtml}
        ${blokHtml}
      </div>
    `;
  }

  function kodeBlok(no, kelompok) { return no + '|' + (kelompok || ''); }

  function blokTerisi(no) {
    const item = state.pertanyaan.find(p => p.no === no);
    return item.blocks.some(b => {
      const v = state.jawaban[kodeBlok(no, b.kelompok)];
      return v && v.trim().length > 0;
    });
  }

  function identitasTerisi() {
    return IDENTITAS_FIELDS.some(f => state.jawaban[f.kode] && state.jawaban[f.kode].trim().length > 0);
  }

  function renderApp() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="layout">
        <aside>
          <div class="brand-block">
            <div class="brand">Kuesioner Satuan Pendidikan</div>
            <div class="brand-sub">${sekolah}</div>
            <div class="brand-asal">${asal}</div>
          </div>
          <div class="nav-scroll" id="navScroll"></div>
        </aside>
        <main>
          <div class="topbar">
            <div class="sekolah-label">Sekolah: <strong>${sekolah}</strong></div>
            <div class="status-badge idle" id="statusBadge">Siap</div>
          </div>
          <div class="content" id="mainContent"></div>
        </main>
      </div>
    `;
    renderNav();
    renderDetail();
  }

  function renderNav() {
    const nav = document.getElementById('navScroll');
    let html = `<div class="nav-section-title">Identitas</div>
      <div class="nav-item ${state.activeNo === 'identitas' ? 'active' : ''}" data-no="identitas">
        <span class="nav-dot ${identitasTerisi() ? 'filled' : ''}"></span>
        <span class="label">Identitas Responden</span>
      </div>`;

    let currentSection = null;
    state.pertanyaan.forEach(p => {
      if (p.section !== currentSection) {
        html += `<div class="nav-section-title">${p.section}</div>`;
        currentSection = p.section;
      }
      const filled = blokTerisi(p.no);
      const active = p.no === state.activeNo;
      html += `
        <div class="nav-item ${active ? 'active' : ''}" data-no="${p.no}">
          <span class="nav-dot ${filled ? 'filled' : ''}"></span>
          <span class="kode">${p.no}</span>
          <span class="label">${p.pertanyaan}</span>
          ${p.kondisional ? '<span class="badge-2025">2025</span>' : ''}
        </div>
      `;
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        state.activeNo = el.dataset.no === 'identitas' ? 'identitas' : Number(el.dataset.no);
        renderNav();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const content = document.getElementById('mainContent');
    if (state.activeNo === 'identitas') { renderIdentitas(content); return; }

    const item = state.pertanyaan.find(p => p.no === state.activeNo);
    if (!item) { content.innerHTML = ''; return; }

    const idx = state.pertanyaan.indexOf(item);
    const prev = idx === 0 ? { no: 'identitas', label: 'Identitas' } : state.pertanyaan[idx - 1];
    const next = state.pertanyaan[idx + 1];

    const blocksHtml = item.blocks.map((b, bi) => {
      const kode = kodeBlok(item.no, b.kelompok);
      const savedRaw = state.jawaban[kode] || '';

      // Pertanyaan teks bebas (Bagian D: Saran & Rekomendasi) -- textarea
      // polos, bukan checkbox.
      if (b.tipe === 'TEKS_BEBAS') {
        return `
          <div class="block" data-kode="${kode}" data-teks-bebas="1">
            ${b.kelompok ? `<div class="block-label">${b.kelompok}</div>` : ''}
            <textarea class="teksbebas-input" rows="6" placeholder="Ketik jawaban di sini...">${savedRaw.replace(/</g, '&lt;')}</textarea>
          </div>
        `;
      }

      const savedSet = new Set(savedRaw.split('\n').filter(Boolean));

      // Pisahkan opsi isian angka dari opsi checkbox biasa
      const angkaOpt = b.opsi.find(o => o.indexOf('(isian angka)') !== -1);
      const checkboxOpts = b.opsi.filter(o => o.indexOf('(isian angka)') === -1);

      let savedAngka = '';
      savedSet.forEach(v => { if (/^\d+%?$/.test(v)) savedAngka = v.replace('%', ''); });

      let savedLainnyaText = '';
      savedSet.forEach(v => { if (checkboxOpts.indexOf(v) === -1 && v !== (savedAngka + '%')) savedLainnyaText = v; });

      const optsHtml = checkboxOpts.map((opt, oi) => `
        <div class="opt-row">
          <input type="${b.tipe === 'PILIHAN_TUNGGAL' ? 'radio' : 'checkbox'}"
                 name="blok-${bi}" id="opt-${bi}-${oi}" value="${opt.replace(/"/g, '&quot;')}"
                 ${savedSet.has(opt) ? 'checked' : ''}>
          <label for="opt-${bi}-${oi}">${opt}</label>
        </div>
      `).join('');

      const angkaHtml = angkaOpt ? `
        <div class="angka-row">
          <label>Alokasi anggaran:</label>
          <input type="number" min="0" max="100" class="angka-input" data-angka="1" value="${savedAngka}"> %
        </div>
      ` : '';

      const lainnyaHtml = b.lainnya ? `
        <input type="text" class="lainnya-input" placeholder="Lainnya, sebutkan..." value="${savedLainnyaText.replace(/"/g, '&quot;')}">
      ` : '';

      return `
        <div class="block" data-kode="${kode}">
          ${b.kelompok ? `<div class="block-label">${b.kelompok}</div>` : ''}
          ${optsHtml}
          ${angkaHtml}
          ${lainnyaHtml}
        </div>
      `;
    }).join('');

    content.innerHTML = `
      <div class="item-kode">No ${item.no} &middot; ${item.section}</div>
      <h2 class="item-title">${item.pertanyaan}</h2>
      ${item.kondisional ? '<div class="kondisional-note">Khusus sekolah yang juga menerima BOSP Kinerja Terbaik Tahun 2025</div><br>' : ''}
      ${item.pendalaman ? `<div class="item-pendalaman">${item.pendalaman}</div>` : ''}
      ${blocksHtml}
      <div class="nav-buttons">
        <button id="btnPrev">&larr; ${prev.no === 'identitas' ? 'Identitas' : 'No ' + prev.no}</button>
        <button id="btnNext" ${!next ? 'disabled' : ''}>${next ? 'No ' + next.no : ''} &rarr;</button>
      </div>
    `;

    item.blocks.forEach((b, bi) => {
      const kode = kodeBlok(item.no, b.kelompok);
      const blockEl = content.querySelector(`.block[data-kode="${CSS.escape(kode)}"]`);

      if (b.tipe === 'TEKS_BEBAS') {
        const textarea = blockEl.querySelector('.teksbebas-input');
        textarea.addEventListener('input', () => {
          state.jawaban[kode] = textarea.value;
          scheduleSave(kode, textarea.value);
        });
        return;
      }

      const collectAndSave = () => {
        const checked = Array.from(blockEl.querySelectorAll('input[type=checkbox]:checked, input[type=radio]:checked')).map(i => i.value);
        const angkaEl = blockEl.querySelector('[data-angka]');
        if (angkaEl && angkaEl.value !== '') checked.push(angkaEl.value + '%');
        const lainnyaEl = blockEl.querySelector('.lainnya-input');
        if (lainnyaEl && lainnyaEl.value.trim()) checked.push(lainnyaEl.value.trim());
        const jawaban = checked.join('\n');
        state.jawaban[kode] = jawaban;
        scheduleSave(kode, jawaban);
      };
      blockEl.querySelectorAll('input[type=checkbox], input[type=radio]').forEach(el => el.addEventListener('change', collectAndSave));
      const angkaEl = blockEl.querySelector('[data-angka]');
      if (angkaEl) angkaEl.addEventListener('input', collectAndSave);
      const lainnyaEl = blockEl.querySelector('.lainnya-input');
      if (lainnyaEl) lainnyaEl.addEventListener('input', collectAndSave);
    });

    document.getElementById('btnPrev').addEventListener('click', () => { state.activeNo = prev.no; renderNav(); renderDetail(); });
    if (next) document.getElementById('btnNext').addEventListener('click', () => { state.activeNo = next.no; renderNav(); renderDetail(); });
  }

  function renderIdentitas(content) {
    const first = state.pertanyaan[0];
    content.innerHTML = `
      <div class="item-kode">IDENTITAS</div>
      <h2 class="item-title">Identitas Responden</h2>
      <div class="identitas-grid">
        <div class="identitas-field"><label>Nama Sekolah</label><input type="text" value="${sekolah}" readonly></div>
        <div class="identitas-field"><label>NPSN</label><input type="text" value="${npsn}" readonly></div>
        <div class="identitas-field"><label>Kabupaten/Kota</label><input type="text" value="${kabkota}" readonly></div>
        <div class="identitas-field full"><label>Provinsi</label><input type="text" value="${provinsi}" readonly></div>
        ${IDENTITAS_FIELDS.map(f => `
          <div class="identitas-field">
            <label>${f.label}</label>
            ${f.tipe === 'select'
              ? `<select data-idkode="${f.kode}"><option value="">Pilih...</option>${f.opsi.map(o => `<option value="${o}" ${state.jawaban[f.kode] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`
              : `<input type="${f.tipe}" data-idkode="${f.kode}" value="${(state.jawaban[f.kode] || '').replace(/"/g, '&quot;')}">`
            }
          </div>
        `).join('')}
      </div>
      <div class="nav-buttons">
        <button disabled>&larr;</button>
        <button id="btnNext">${first ? 'No ' + first.no : ''} &rarr;</button>
      </div>
    `;
    content.querySelectorAll('[data-idkode]').forEach(el => {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
        const kode = el.dataset.idkode;
        state.jawaban[kode] = el.value;
        scheduleSave(kode, el.value);
      });
    });
    if (first) document.getElementById('btnNext').addEventListener('click', () => { state.activeNo = first.no; renderNav(); renderDetail(); });
  }

  let toastTimer = null;
  function tampilkanToast(pesan, jenis) {
    let el = document.getElementById('toastEl');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toastEl';
      document.body.appendChild(el);
    }
    el.textContent = pesan;
    el.className = 'toast show' + (jenis ? ' toast-' + jenis : '');
    clearTimeout(toastTimer);
    const durasi = jenis === 'selesai' ? 4000 : (jenis === 'error' ? 2500 : 1500);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, durasi);
  }

  // Sekali dirayakan per sesi buka halaman, supaya tidak muncul berulang
  // tiap kali edit jawaban setelah semuanya sudah lengkap.
  let sudahRayakanSelesai = false;
  function cekSelesaiSemua() {
    if (sudahRayakanSelesai || !state.pertanyaan.length) return;
    const semuaTerisi = state.pertanyaan.every(p => blokTerisi(p.no));
    if (semuaTerisi) {
      sudahRayakanSelesai = true;
      tampilkanToast('Semua pertanyaan sudah terisi. Terima kasih!', 'selesai');
    }
  }

  function scheduleSave(kode, jawaban) {
    setStatus('saving');
    clearTimeout(state.saveTimers[kode]);
    state.saveTimers[kode] = setTimeout(() => saveJawaban(kode, jawaban), 900);
  }

  async function saveJawaban(kode, jawaban) {
    try {
      const data = await fetchDenganRetry(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'save-satdik-jawaban', sekolah: sekolah, kode: kode, jawaban: jawaban, asal: asal, kabkota: kabkota, npsn: npsn })
      });
      setStatus(data.ok ? 'saved' : 'error');
      if (data.ok) {
        tampilkanToast('Tersimpan');
        renderNav();
        cekSelesaiSemua();
      } else {
        renderNav();
      }
    } catch (err) {
      setStatus('error');
      tampilkanToast('Gagal menyimpan, coba lagi', 'error');
      console.error(err);
    }
  }

  function setStatus(kind) {
    const badge = document.getElementById('statusBadge');
    if (!badge) return;
    const labels = { saving: 'Menyimpan...', saved: 'Tersimpan', error: 'Gagal menyimpan, coba lagi', idle: 'Siap' };
    badge.className = 'status-badge ' + kind;
    badge.textContent = labels[kind];
  }

  init();
</script>

</body>
</html>
