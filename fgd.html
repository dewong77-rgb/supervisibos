<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notulensi FGD — Supervisi BOSP Kinerja 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1A3E6F;
    --navy-deep: #122A4D;
    --gold: #E8A020;
    --paper: #FAF7F1;
    --paper-card: #FFFFFF;
    --ink: #22262E;
    --ink-soft: #5B6270;
    --line: #E4DFD3;
    --green: #2E7D5B;
    --red: #B84C3E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Public Sans', sans-serif; height: 100vh; overflow: hidden; }
  h1, h2, .brand { font-family: 'Fraunces', serif; }

  .layout { display: flex; height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside {
    width: 320px;
    flex-shrink: 0;
    background: var(--navy);
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  aside .brand-block {
    padding: 18px 18px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  aside .brand { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  aside .brand-sub { font-size: 12px; color: rgba(255,255,255,0.65); }
  aside .search-box {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  aside .search-box input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
  }
  aside .search-box input::placeholder { color: rgba(255,255,255,0.45); }
  aside .search-box input:focus { outline: none; border-color: var(--gold); }

  .nav-scroll { flex: 1; overflow-y: auto; padding: 8px 0 18px; }
  .nav-section { margin-bottom: 4px; }
  .nav-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.5);
    padding: 12px 18px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 18px;
    cursor: pointer;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: rgba(255,255,255,0.12); border-left-color: var(--gold); color: white; font-weight: 600; }
  .nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.25); }
  .nav-dot.filled { background: var(--gold); }
  .nav-item .kode { font-variant-numeric: tabular-nums; opacity: 0.7; flex-shrink: 0; width: 46px; }
  .nav-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Main ---------- */
  main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .topbar {
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper-card);
  }
  .topbar .kabkota-label { font-size: 13px; color: var(--ink-soft); }
  .topbar .kabkota-label strong { color: var(--ink); }
  .status-badge { font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 20px; }
  .status-badge.saved { background: #E9F3EC; color: var(--green); }
  .status-badge.saving { background: #FBEBD8; color: #A5651A; }
  .status-badge.error { background: #FBE9E6; color: var(--red); }
  .status-badge.idle { background: #EFEAE0; color: var(--ink-soft); }

  .content { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 800px; }

  .item-kode { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
  .item-title { font-size: 21px; font-weight: 600; line-height: 1.35; margin: 0 0 14px; color: var(--navy-deep); }
  .item-pendalaman {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    background: #F3EEE3;
    border-left: 3px solid var(--gold);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 22px;
  }
  textarea {
    width: 100%;
    min-height: 260px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-family: 'Public Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--navy); }

  .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
  .nav-buttons button {
    background: var(--paper-card);
    border: 1px solid var(--line);
    color: var(--navy);
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  .nav-buttons button:hover { border-color: var(--navy); }
  .nav-buttons button:disabled { opacity: 0.4; cursor: default; }

  /* ---------- Picker (belum ada kab/kota di URL) ---------- */
  .picker { max-width: 480px; margin: 80px auto; text-align: center; }
  .picker h1 { font-size: 22px; margin-bottom: 8px; color: var(--navy-deep); }
  .picker p { color: var(--ink-soft); font-size: 14px; margin-bottom: 24px; }
  .picker-list { display: flex; flex-direction: column; gap: 8px; }
  .picker-list a {
    display: block;
    padding: 14px 18px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
  }
  .picker-list a:hover { border-color: var(--navy); }

  .loading-state { text-align: center; padding: 80px 20px; color: var(--ink-soft); }
</style>
</head>
<body>

<div id="app"></div>

<script>
  // Ganti dengan Web App URL yang sama dengan dashboard utama
  const API_URL = 'https://script.google.com/macros/s/AKfycbwH15DkjOR3dI6etG7aAWMP_r9bPCLSI5o94jmJKlf1BB5b1uYqUOspNNI_gfpEAA7fgw/exec';

  const params = new URLSearchParams(window.location.search);
  const kabkota = params.get('kabkota');

  let state = { pertanyaan: [], jawaban: {}, activeKode: null, saveTimer: null };

  async function init() {
    if (!kabkota) {
      await renderPicker();
      return;
    }
    renderLoading();
    try {
      const res = await fetch(`${API_URL}?action=fgd-data&kabkota=${encodeURIComponent(kabkota)}`);
      const data = await res.json();
      if (data.error) {
        document.getElementById('app').innerHTML = `<div class="loading-state">${data.error}</div>`;
        return;
      }
      state.pertanyaan = data.pertanyaan;
      state.jawaban = data.jawaban || {};
      state.activeKode = data.pertanyaan[0] ? data.pertanyaan[0].kode : null;
      renderApp();
    } catch (err) {
      document.getElementById('app').innerHTML = '<div class="loading-state">Gagal memuat data. Coba muat ulang halaman.</div>';
      console.error(err);
    }
  }

  function renderLoading() {
    document.getElementById('app').innerHTML = '<div class="loading-state">Memuat instrumen...</div>';
  }

  async function renderPicker() {
    document.getElementById('app').innerHTML = '<div class="loading-state">Memuat daftar lokus FGD...</div>';
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      const kabkotaSet = [...new Set(data.progres.filter(r => r.instrumen === 'Notulensi FGD').map(r => r.kabkota))];
      document.getElementById('app').innerHTML = `
        <div class="picker">
          <h1>Pilih lokus FGD</h1>
          <p>Belum ada kab/kota dipilih. Pilih salah satu, atau minta link personal dari koordinator.</p>
          <div class="picker-list">
            ${kabkotaSet.map(k => `<a href="?kabkota=${encodeURIComponent(k)}">${k}</a>`).join('')}
          </div>
        </div>
      `;
    } catch (err) {
      document.getElementById('app').innerHTML = '<div class="loading-state">Gagal memuat daftar lokus.</div>';
    }
  }

  function groupBySection(pertanyaan) {
    const map = {};
    pertanyaan.forEach(p => {
      if (!map[p.section]) map[p.section] = [];
      map[p.section].push(p);
    });
    return map;
  }

  function renderApp() {
    const groups = groupBySection(state.pertanyaan);
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="layout">
        <aside>
          <div class="brand-block">
            <div class="brand">Notulensi FGD</div>
            <div class="brand-sub">${kabkota}</div>
          </div>
          <div class="search-box"><input type="text" id="navSearch" placeholder="Cari topik..."></div>
          <div class="nav-scroll" id="navScroll"></div>
        </aside>
        <main>
          <div class="topbar">
            <div class="kabkota-label">Lokus: <strong>${kabkota}</strong></div>
            <div class="status-badge idle" id="statusBadge">Siap</div>
          </div>
          <div class="content" id="mainContent"></div>
        </main>
      </div>
    `;
    document.getElementById('navSearch').addEventListener('input', renderNav);
    renderNav();
    renderDetail();
  }

  function renderNav() {
    const search = document.getElementById('navSearch').value.toLowerCase();
    const groups = groupBySection(state.pertanyaan);
    const nav = document.getElementById('navScroll');
    let html = '';
    Object.keys(groups).forEach(section => {
      const items = groups[section].filter(p =>
        !search || p.pertanyaan.toLowerCase().indexOf(search) !== -1 || p.kode.toLowerCase().indexOf(search) !== -1
      );
      if (!items.length) return;
      html += `<div class="nav-section"><div class="nav-section-title">${section}</div>`;
      items.forEach(p => {
        const filled = state.jawaban[p.kode] && state.jawaban[p.kode].trim().length > 0;
        const active = p.kode === state.activeKode;
        html += `
          <div class="nav-item ${active ? 'active' : ''}" data-kode="${p.kode}">
            <span class="nav-dot ${filled ? 'filled' : ''}"></span>
            <span class="kode">${p.kode}</span>
            <span class="label">${p.pertanyaan}</span>
          </div>
        `;
      });
      html += '</div>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        state.activeKode = el.dataset.kode;
        renderNav();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const item = state.pertanyaan.find(p => p.kode === state.activeKode);
    const content = document.getElementById('mainContent');
    if (!item) { content.innerHTML = ''; return; }

    const idx = state.pertanyaan.indexOf(item);
    const prev = state.pertanyaan[idx - 1];
    const next = state.pertanyaan[idx + 1];

    content.innerHTML = `
      <div class="item-kode">${item.kode} &middot; ${item.section}</div>
      <h2 class="item-title">${item.pertanyaan}</h2>
      ${item.pendalaman ? `<div class="item-pendalaman">${item.pendalaman}</div>` : ''}
      <textarea id="jawabanBox" placeholder="Ketik catatan di sini...">${state.jawaban[item.kode] || ''}</textarea>
      <div class="nav-buttons">
        <button id="btnPrev" ${!prev ? 'disabled' : ''}>&larr; ${prev ? prev.kode : ''}</button>
        <button id="btnNext" ${!next ? 'disabled' : ''}>${next ? next.kode : ''} &rarr;</button>
      </div>
    `;

    const box = document.getElementById('jawabanBox');
    box.focus();
    box.addEventListener('input', () => {
      state.jawaban[item.kode] = box.value;
      scheduleSave(item.kode, box.value);
    });

    if (prev) document.getElementById('btnPrev').addEventListener('click', () => { state.activeKode = prev.kode; renderNav(); renderDetail(); });
    if (next) document.getElementById('btnNext').addEventListener('click', () => { state.activeKode = next.kode; renderNav(); renderDetail(); });
  }

  function scheduleSave(kode, jawaban) {
    setStatus('saving');
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => saveJawaban(kode, jawaban), 1200);
  }

  async function saveJawaban(kode, jawaban) {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight
        body: JSON.stringify({ action: 'save-fgd-jawaban', kabkota: kabkota, kode: kode, jawaban: jawaban })
      });
      const data = await res.json();
      setStatus(data.ok ? 'saved' : 'error');
      renderNav(); // update titik terisi di sidebar
    } catch (err) {
      setStatus('error');
      console.error(err);
    }
  }

  function setStatus(kind) {
    const badge = document.getElementById('statusBadge');
    if (!badge) return;
    const labels = { saving: 'Menyimpan...', saved: 'Tersimpan', error: 'Gagal menyimpan — coba lagi', idle: 'Siap' };
    badge.className = 'status-badge ' + kind;
    badge.textContent = labels[kind];
  }

  init();
</script>

</body>
</html>
